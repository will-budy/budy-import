name: Docs Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          config: .markdownlint.json
          globs: |
            v2/**/*.md
            !v2/**/*.excalidraw.md

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check links
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: --config .lychee.toml --root-dir "$(pwd)" "v2/**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mkdocs-build:
    name: MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Build documentation site
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
