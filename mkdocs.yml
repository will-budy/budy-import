site_name: OB Platform Wiki
site_description: Central architecture and context repository for Budy platform systems
repo_name: ob-platform-wiki
docs_dir: v2
site_dir: site
use_directory_urls: false
exclude_docs: |
  **/*.excalidraw.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Product Vision: vision/ProductVision-Roadmap-Budy-2.md
  - Microservices:
      - Execution Mode Services:
          - Overview: micro-services/execution-mode-services/info.md
          - nainai-cluster-1:
              - Service: micro-services/execution-mode-services/nainai-cluster-1/info.md
              - Console: micro-services/execution-mode-services/nainai-cluster-1/console.md
              - Tenant provisioning (proposal): micro-services/execution-mode-services/nainai-cluster-1/tenant-provisioning.md
          - gitjib-cluster-1: micro-services/execution-mode-services/gitjib-cluster-1/info.md
          - pitcrew-cluster-1:
              - Overview: micro-services/execution-mode-services/pitcrew-cluster-1/info.md
              - PRD: micro-services/execution-mode-services/pitcrew-cluster-1/prd.md
              - HLD: micro-services/execution-mode-services/pitcrew-cluster-1/hld.md
              - TRD: micro-services/execution-mode-services/pitcrew-cluster-1/trd.md
              - Nexus contracts: micro-services/execution-mode-services/pitcrew-cluster-1/nexus-contracts.md
          - dt-consulting-services-1:
              - Service: micro-services/execution-mode-services/dt-consulting-services-1/info.md
              - Engagement flow: micro-services/execution-mode-services/dt-consulting-services-1/engagement-flow.md
              - Console: micro-services/execution-mode-services/dt-consulting-services-1/console.md
          - karkhana-cluster-1:
              - Service: micro-services/execution-mode-services/karkhana-cluster-1/info.md
              - Sandboxes: micro-services/execution-mode-services/karkhana-cluster-1/sandboxes.md
              - Console: micro-services/execution-mode-services/karkhana-cluster-1/console.md
          - events-cluster-1: micro-services/execution-mode-services/events-cluster-1/info.md
          - janus-cluster-1: micro-services/execution-mode-services/janus-cluster-1/info.md
          - glassbox-1: micro-services/execution-mode-services/glassbox-1/info.md
          - studio-services-cluster-1:
              - Overview: micro-services/execution-mode-services/studio-services-cluster-1/info.md
              - HLD: micro-services/execution-mode-services/studio-services-cluster-1/hld.md
              - Nexus contracts: micro-services/execution-mode-services/studio-services-cluster-1/nexus-contracts.md
