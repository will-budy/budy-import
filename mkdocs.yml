          - github-infra: gitops/repositories/github-infra/index.md
          - platform-actions: gitops/repositories/platform-actions/index.md
          - budy-cloud-management: gitops/repositories/budy-cloud-management/index.md
          - vault-management-1: gitops/repositories/vault-management-1/index.md
          - k8s-security: gitops/repositories/k8s-security/index.md
          - argocd-critical-stack: gitops/repositories/argocd-critical-stack/index.md
          - argocd-eks-stack: gitops/repositories/argocd-eks-stack/index.md
